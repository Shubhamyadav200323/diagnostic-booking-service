services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnostics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diagnostics"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/diagnostics
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_dev_secret}
      MOCK_PAYMENT_SUCCESS_RATE: ${MOCK_PAYMENT_SUCCESS_RATE:-0.8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # demo admin created on startup - dev only, don't use these in production
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
